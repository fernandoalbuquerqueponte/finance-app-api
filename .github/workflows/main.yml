# Nome da nossa action
name: Deploy

on:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Use Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '20'

            - name: Create .env.test file
              run: echo 'DATABASE_URL="postgresql://root:password@localhost:5433/financeapp?schema=public"' >> .env.test

            - name: Install dependencies
              run: npm install

            - name: Eslint
              run: npm run eslint:check

            - name: Prettier
              run: npm run prettier:check

            - name: Test
              run: |
                  export $(cat .env.test | xargs)
                  npm run test
